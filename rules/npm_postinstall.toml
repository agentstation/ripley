# Detection rules for npm lifecycle scripts (postinstall, preinstall, prepare).
# Compiled into the binary at build time via include_str!.
# Each rule has an id, signal type, weight, and list of regex patterns.

[[rules]]
id = "NPM001"
name = "network-call"
description = "Network calls in lifecycle scripts"
ecosystem = "npm"
signal = "network_call"
weight = "high"
patterns = [
    'curl\s',
    'wget\s',
    'fetch\(',
    'http\.get\(',
    'https\.get\(',
    'net\.connect',
    'axios\.',
    'node-fetch',
    'got\(',
    'request\(',
    'XMLHttpRequest',
]

[[rules]]
id = "NPM002"
name = "code-generation"
description = "Dynamic code generation (eval, Function constructor)"
ecosystem = "npm"
signal = "code_generation"
weight = "high"
patterns = [
    '\beval\(',
    '\bFunction\(',
    'new Function',
    'vm\.runIn',
    'vm\.createContext',
]

[[rules]]
id = "NPM003"
name = "encoding-obfuscation"
description = "Encoding or obfuscation patterns"
ecosystem = "npm"
signal = "encoding_obfuscation"
weight = "high"
patterns = [
    'Buffer\.from\(.+,\s*["\x27]base64',
    '\batob\(',
    '\bbtoa\(',
    'String\.fromCharCode',
    'charCodeAt',
    'base64\s+--decode',
    'base64\s+-d',
]

[[rules]]
id = "NPM004"
name = "binary-download-execute"
description = "Downloading and executing binaries"
ecosystem = "npm"
signal = "binary_execution"
weight = "critical"
patterns = [
    'curl.*\|.*sh',
    'wget.*\|.*sh',
    'chmod\s+[+]?[0-7]*x',
    '\.exe\b',
    '/tmp/.*&&.*\./',
]

[[rules]]
id = "NPM005"
name = "shell-spawning"
description = "Child process and shell spawning"
ecosystem = "npm"
signal = "shell_spawning"
weight = "high"
patterns = [
    'child_process\.exec',
    'child_process\.spawn',
    'child_process\.execSync',
    'child_process\.execFile',
    'subprocess\.run',
    'os\.system\(',
    'execSync\(',
    'spawnSync\(',
]

[[rules]]
id = "NPM006"
name = "env-harvesting"
description = "Bulk environment variable access"
ecosystem = "npm"
signal = "env_harvesting"
weight = "medium"
patterns = [
    'JSON\.stringify\(process\.env\)',
    'Object\.keys\(process\.env\)',
    'Object\.entries\(process\.env\)',
    '\.env\b.*readFile',
]

[[rules]]
id = "NPM007"
name = "scope-escape"
description = "Writing outside the package directory"
ecosystem = "npm"
signal = "scope_escape"
weight = "medium"
patterns = [
    'os\.homedir\(\)',
    'process\.env\.HOME',
    'process\.env\.USERPROFILE',
    '~/\.',
    '\.\./\.\.',
]

[[rules]]
id = "NPM008"
name = "obfuscation-tools"
description = "Known obfuscation tool markers"
ecosystem = "npm"
signal = "obfuscation_tools"
weight = "critical"
patterns = [
    'javascript-obfuscator',
    'Pyarmor',
    'pkg\.exports.*obfusc',
    'js-confuser',
    'bytenode',
]

[[rules]]
id = "NPM009"
name = "ai-tool-config-write"
description = "Writes to AI coding tool configuration paths (persistence + prompt injection)"
ecosystem = "npm"
signal = "ai_tool_config_write"
weight = "critical"
patterns = [
    '\.claude/settings\.json',
    '\.claude/execution',
    '\.cursor/mcp\.json',
    '\.vscode/tasks\.json',
    '\.github/copilot/',
    '\.continue/',
]

[[rules]]
id = "NPM010"
name = "mcp-server-injection"
description = "Installing rogue MCP server definitions for prompt injection"
ecosystem = "npm"
signal = "mcp_server_injection"
weight = "critical"
patterns = [
    '\.mcp\.json',
    'mcp\.json',
    '"servers"\s*:\s*\{',
    'mcp.*server.*install',
    'claude_desktop_config\.json',
]
