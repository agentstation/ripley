# Cross-ecosystem credential exfiltration patterns.
# Detects scripts reading sensitive credential files or tokens.

[[rules]]
id = "CRED001"
name = "ssh-key-read"
description = "Reading SSH private keys"
ecosystem = "all"
signal = "credential_exfil"
weight = "critical"
patterns = [
    '\.ssh/id_rsa',
    '\.ssh/id_ed25519',
    '\.ssh/id_ecdsa',
    '\.ssh/id_dsa',
    '\.ssh/config',
    'SSH_PRIVATE_KEY',
    'SSH_AUTH_SOCK',
]

[[rules]]
id = "CRED002"
name = "npm-token-read"
description = "Reading npm authentication tokens"
ecosystem = "all"
signal = "credential_exfil"
weight = "critical"
patterns = [
    '\.npmrc',
    'NPM_TOKEN',
    'npm_config_',
    'NODE_AUTH_TOKEN',
]

[[rules]]
id = "CRED003"
name = "aws-credential-read"
description = "Reading AWS credentials"
ecosystem = "all"
signal = "credential_exfil"
weight = "critical"
patterns = [
    '\.aws/credentials',
    '\.aws/config',
    'AWS_ACCESS_KEY_ID',
    'AWS_SECRET_ACCESS_KEY',
    'AWS_SESSION_TOKEN',
]

[[rules]]
id = "CRED004"
name = "env-file-read"
description = "Reading .env files containing secrets"
ecosystem = "all"
signal = "credential_exfil"
weight = "high"
patterns = [
    'readFile.*\.env',
    'cat\s+\.env',
    'source\s+\.env',
    '[/~]\.env\b',
    '\.env\.local',
    '\.env\.production',
]

[[rules]]
id = "CRED005"
name = "cloud-token-read"
description = "Reading cloud provider and service tokens"
ecosystem = "all"
signal = "credential_exfil"
weight = "critical"
patterns = [
    '\.docker/config\.json',
    '\.kube/config',
    'gcloud.*credentials',
    'GITHUB_TOKEN',
    'GH_TOKEN',
    'GITLAB_TOKEN',
    'HEROKU_API_KEY',
    'SLACK_TOKEN',
    'DISCORD_TOKEN',
]

[[rules]]
id = "CRED006"
name = "browser-credential-read"
description = "Reading browser stored credentials and cookies"
ecosystem = "all"
signal = "credential_exfil"
weight = "critical"
patterns = [
    'Login Data',
    'Cookies/Cookies\.db',
    'Chrome/.*Local State',
    'keychains/',
    'Keychain\.db',
]
