[workspace]
resolver = "2"
members = [
    "crates/ripley-core",
    "crates/ripley-guard",
    "crates/ripley-ipc",
    "crates/ripley-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/agentstation/ripley"

[workspace.dependencies]
# Shared across crates
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
chrono = { version = "0.4", features = ["serde"] }

# Core library
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
redb = "4"
semver = { version = "1", features = ["serde"] }
notify = "8"
thiserror = "2"
regex = "1"

# CLI / Guard binary
clap = { version = "4", features = ["derive"] }
anyhow = "1"
colored = "3"

# Tray app / UI
tray-icon = "0.19"
muda = "0.16"
iced = { version = "0.13", features = ["tokio"] }
notify-rust = "4"
tokio-util = { version = "0.7", features = ["rt"] }
tracing-appender = "0.2"

# Internal
ripley-core = { path = "crates/ripley-core" }
ripley-ipc = { path = "crates/ripley-ipc" }

# Testing
insta = { version = "1", features = ["json"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"

[profile.release]
lto = true
strip = true
codegen-units = 1
