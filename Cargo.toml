[workspace]
resolver = "2"
members = [
    "crates/ripley-core",
    "crates/ripley-guard",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/agentstation/ripley"

[workspace.dependencies]
# Shared across crates
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Core library
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
redb = "2"
semver = "1"
notify = "6"
thiserror = "2"

# CLI / Guard binary
clap = { version = "4", features = ["derive"] }
anyhow = "1"
flate2 = "1"
tar = "0.4"
colored = "2"
dialoguer = "0.11"

# Internal
ripley-core = { path = "crates/ripley-core" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = true
strip = true
codegen-units = 1
