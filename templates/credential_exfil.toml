id = "credential-exfil"
name = "Credential Exfiltration"
attack_type = "credential_exfil"
description = "Supply chain attack focused on exfiltrating credentials and tokens from developer machines via postinstall scripts or malicious imports."

ioc_checks = [
    "~/.npmrc (check for recent modification)",
    "~/.ssh/authorized_keys (unauthorized entries)",
    "~/.aws/credentials (check for recent access)",
    "~/.docker/config.json (check for unauthorized registries)",
    ".env files (check git log for exposure)",
]

verification_steps = [
    "Check shell history for unexpected curl/wget to external hosts",
    "Review outbound DNS queries for data exfiltration patterns",
    "Verify all SSH authorized_keys entries are recognized",
    "Check npm/pip/gem login timestamps for unexpected sessions",
    "Review CI/CD pipeline logs for unauthorized deployments",
]

[[credential_rotation]]
credential = "~/.npmrc"
command = "npm token revoke <token> && npm login --auth-type=web"
priority = "critical"

[[credential_rotation]]
credential = "~/.ssh/id_*"
command = "ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519_new && update remote services"
priority = "critical"

[[credential_rotation]]
credential = "~/.aws/credentials"
command = "aws iam delete-access-key --access-key-id <key> && aws iam create-access-key"
priority = "high"

[[credential_rotation]]
credential = "~/.docker/config.json"
command = "docker logout && docker login"
priority = "high"
